<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mi Negocio</title>
  </head>
  <body>
    <div id="root">
      <!-- Splash inicial para evitar pantallazo blanco en actualizaciones -->
      <div id="initial-splash" style="position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; color: white; transition: opacity 0.5s ease-out;">
        <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div style="position: absolute; width: 100%; height: 100%; border: 4px solid rgba(59, 130, 246, 0.1); border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <div style="font-size: 2rem; font-weight: 900; color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);">L</div>
        </div>
        <p style="color: #94a3b8; font-size: 0.9rem; margin: 0; font-family: sans-serif;">Iniciando sistema...</p>
        <style>
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <div id="portal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
